name: Orbit CI

on:
  push:
    branches: ["wip/app-shell", "main", "deploy/base44-connected", "fix/games-browser-auth"]
  pull_request:
    branches: ["wip/app-shell", "main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint
